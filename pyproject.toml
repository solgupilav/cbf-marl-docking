[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbf-marl-docking"
version = "1.0.0"
description = "Safe multi-agent spacecraft docking with control barrier functions and reinforcement learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Selim Olgu Pilav"}]
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
